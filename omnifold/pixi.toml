[workspace]
name = "four-lepton-omnifold"
version = "0.1.0"
description = "Notebook and command-line signed-weight OmniFold with raw NN density ratios"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.40,<1"
readme = "README.md"

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<2"
uproot = ">=5.6,<6"
awkward = ">=2.8,<3"
matplotlib-base = ">=3.10,<4"
hist = ">=2.8,<3"
mplhep = ">=0.4,<1"
ipykernel = ">=6.29,<7"
jupyterlab = ">=4.3,<5"
nbformat = ">=5.10,<6"

[pypi-dependencies]
torch = "==2.10.0"
pytorch-lightning = "==2.6.1"
nsbi-common-utils = { git = "https://github.com/iris-hep/nsbi-lhc-toolkit.git", rev = "fc09848fc6540fd32310faebbe9db6eea7ecd17b" }

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
install-kernel = { cmd = "python -m ipykernel install --user --name fourlepton-omnifold --display-name 'FourLepton OmniFold'", cwd = "..", description = "Register the environment with Unity OnDemand JupyterLab" }
notebook = { cmd = "jupyter lab omnifold/interactive_omnifold.ipynb", cwd = "..", description = "Open the interactive OmniFold notebook" }
train = { cmd = "python -m omnifold train", cwd = "..", description = "Create an OmniFold campaign and train the requested iterations" }
resume = { cmd = "python -m omnifold resume", cwd = "..", description = "Train additional iterations in an existing campaign" }
report = { cmd = "python -m omnifold report", cwd = "..", description = "Save PDF diagnostics for completed iterations without retraining" }
apply = { cmd = "python -m omnifold apply", cwd = "..", description = "Decorate data and nominal MC with the frozen iteration sequence" }
history = { cmd = "python -m omnifold history", cwd = "..", description = "Print the completed-iteration history as JSON" }
likelihood = { cmd = "python -m omnifold likelihood", cwd = "..", description = "Evaluate frozen-model likelihood objectives and print JSON" }
test = { cmd = "python -m unittest discover -s omnifold/tests -v", cwd = "..", description = "Run OmniFold regression tests" }
